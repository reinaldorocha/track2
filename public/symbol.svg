<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="utmt_brand_grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="60%" stop-color="#00D4FF" />
      <stop offset="100%" stop-color="#39E6FF" />
    </linearGradient>
    <linearGradient id="utmt_glow_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0066FF" stop-opacity="0.05" />
    </linearGradient>
    <filter id="utmt_glow_filter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00D4FF" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Dark Navy Container -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="#081A33" stroke="#142C52" stroke-width="2" />
  <rect x="5" y="5" width="90" height="90" rx="21" fill="url(#utmt_glow_grad)" />

  <!-- Outer Tracking Arc (Trajectory) -->
  <path d="M28 34 V54 C28 66 38 74 50 74 C62 74 72 66 72 54 V40" stroke="url(#utmt_brand_grad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#utmt_glow_filter)" />

  <!-- Arrow Head pointing Up-Right -->
  <path d="M58 40 L72 32 L80 46" fill="none" stroke="url(#utmt_brand_grad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Center Tracking Node -->
  <circle cx="50" cy="52" r="5" fill="#39E6FF" />
  <circle cx="50" cy="52" r="10" stroke="#00D4FF" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="2 3" />
</svg>
